# Daily sync of Roblox API stats (visits, favorites, online players).
# Commits to main if data changed → triggers deploy workflow.

name: Daily Roblox Stats Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sync-pickaxe-tycoon
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Roblox stats
        run: node scripts/sync-roblox-stats.mjs

      - name: Validate game data
        run: node scripts/validate-game-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add src/data/game.config.json src/data/codes.json
          git commit -m "chore: daily Roblox stats sync" -m "Update visits, favorites, online count, and last-checked dates from Roblox Games API."
          git push
