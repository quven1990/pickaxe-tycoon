# Deploy static site to Cloudflare Pages
#
# Required GitHub secret: CLOUDFLARE_API_TOKEN
# Token permissions: Account > Cloudflare Pages > Edit; Zone > Cache Purge; Zone > Zone > Read
# Account ID via CLOUDFLARE_ACCOUNT_ID env (NOT in wrangler.toml — Pages rejects account_id)

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily sync pushes with GITHUB_TOKEN do not trigger push workflows.
  # Chain deploy after the scheduled sync completes instead.
  workflow_run:
    workflows: [Daily Roblox Stats Sync]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-pickaxe-tycoon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_ACCOUNT_ID: a17c720d27e1e3b502bef6b0d57c5472
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run SHA is the pre-sync commit; deploy latest main instead.
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.sha }}

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          verify=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${TOKEN}")
          if ! echo "$verify" | grep -q '"success":true'; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid or expired."
            exit 1
          fi
          echo "Cloudflare token verified."

      - name: Apply Cloudflare P0 settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          PURGE_ZONE_NAME: pickaxe-tycoon.xyz
          VERIFY_SITE_URL: https://pickaxe-tycoon.xyz
        run: node scripts/fix-cloudflare-p0.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          export CLOUDFLARE_ACCOUNT_ID="${{ env.CLOUDFLARE_ACCOUNT_ID }}"
          npx wrangler pages deploy out --project-name=pickaxe-tycoon --branch=main

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PURGE_ZONE_NAME: pickaxe-tycoon.xyz
        run: |
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          zone_resp=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=${PURGE_ZONE_NAME}" \
            -H "Authorization: Bearer ${TOKEN}")
          zone_id=$(echo "$zone_resp" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else '')")
          if [ -z "$zone_id" ]; then
            echo "::error::Could not resolve Zone ID for ${PURGE_ZONE_NAME}."
            echo "Add Zone > Zone > Read to CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          echo "Purging cache for zone ${PURGE_ZONE_NAME} (${zone_id})..."
          purge_resp=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if ! echo "$purge_resp" | grep -q '"success":true'; then
            echo "::error::Cache purge failed: ${purge_resp}"
            echo "Add Zone > Cache Purge to CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          echo "Cloudflare cache purged successfully."

      - name: Verify live sitemap (Googlebot)
        run: |
          sleep 8
          node scripts/verify-sitemap-live.mjs

      - name: Verify live CSS bundles
        run: |
          sleep 3
          node scripts/verify-css-live.mjs

      - name: Submit URLs to Bing IndexNow
        run: node scripts/submit-indexnow.mjs
