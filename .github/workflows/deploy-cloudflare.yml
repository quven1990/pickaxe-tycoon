# Deploy static site to Cloudflare Pages (no Dashboard build queue).
#
# Required GitHub secret: CLOUDFLARE_API_TOKEN
# Account ID is in wrangler.toml

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pickaxe-tycoon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_ACCOUNT_ID: a17c720d27e1e3b502bef6b0d57c5472
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN."
            echo "::error::Create token: https://dash.cloudflare.com/profile/api-tokens"
            echo "::error::Template: Edit Cloudflare Workers (includes Pages deploy)"
            echo "::error::Add at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "Verifying API token..."
          verify=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "$verify" | head -c 500
          if ! echo "$verify" | grep -q '"success":true'; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid or expired."
            echo "::error::Re-create at https://dash.cloudflare.com/profile/api-tokens (template: Edit Cloudflare Workers)"
            echo "::error::Paste ONLY the long token string — not the permission summary text."
            echo "::error::Update at https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "Cloudflare token verified."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          export CLOUDFLARE_ACCOUNT_ID="${{ env.CLOUDFLARE_ACCOUNT_ID }}"
          # Create Pages project if it does not exist yet (ignore error if already exists)
          npx wrangler pages project create pickaxe-tycoon --production-branch=main 2>&1 || true
          npx wrangler pages deploy out --project-name=pickaxe-tycoon --branch=main --commit-dirty=true
