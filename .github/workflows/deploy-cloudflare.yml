# Deploy static site to Cloudflare Pages (no Dashboard build queue).
#
# Required GitHub secret: CLOUDFLARE_API_TOKEN
# Account ID is in wrangler.toml

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pickaxe-tycoon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_ACCOUNT_ID: a17c720d27e1e3b502bef6b0d57c5472
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN."
            echo "::error::Add at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "Verifying API token..."
          verify=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "$verify" | head -c 500
          if ! echo "$verify" | grep -q '"success":true'; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid or expired."
            exit 1
          fi
          echo "Checking Cloudflare Pages API access..."
          pages=$(curl -sS -w "\n%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${TOKEN}")
          http_code=$(echo "$pages" | tail -n1)
          body=$(echo "$pages" | sed '$d')
          echo "$body" | head -c 500
          if [ "$http_code" = "403" ] || [ "$http_code" = "401" ]; then
            echo "::error::Token cannot access Cloudflare Pages (HTTP ${http_code})."
            echo "::error::Recreate token with Account → Cloudflare Pages → Edit permission."
            exit 1
          fi
          echo "Cloudflare token verified (Pages API HTTP ${http_code})."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: List build output
        run: ls -la out/ | head -20

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          resp=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"pickaxe-tycoon-quven","production_branch":"main"}')
          http_code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "$body" | head -c 500
          echo "Create project HTTP ${http_code} (8000007/8000015 = already exists, OK)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pickaxe-tycoon-quven
          directory: out
          branch: main
