# Deploy static site to Cloudflare Pages (no Dashboard build queue).
#
# Required GitHub secret: CLOUDFLARE_API_TOKEN
# Account ID is in wrangler.toml

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pickaxe-tycoon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_ACCOUNT_ID: a17c720d27e1e3b502bef6b0d57c5472
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN."
            echo "::error::Add at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "Verifying API token..."
          verify=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${TOKEN}")
          echo "$verify" | head -c 500
          if ! echo "$verify" | grep -q '"success":true'; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid or expired."
            exit 1
          fi
          echo "Cloudflare token verified."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: List build output
        run: ls -la out/ | head -20

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pickaxe-tycoon-quven
          directory: out
          branch: main
